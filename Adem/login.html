<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giriş Yap - Film Dünyası</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <div class="container">
    <div class="row justify-content-center align-items-center min-vh-100">
      <div class="col-md-6 col-lg-4">

        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h3 class="text-center mb-4">Giriş Yap</h3>

            <form action="index.html">
              <div class="mb-3">
                <label for="eposta" class="form-label">E-posta</label>
                <input type="email" class="form-control" id="eposta" placeholder="E-posta adresiniz" required>
              </div>

              <div class="mb-3">
                <label for="sifre" class="form-label">Şifre</label>
                <input type="password" class="form-control" id="sifre" placeholder="Şifreniz" required>
              </div>

              <button type="submit" class="btn btn-danger w-100">Giriş Yap</button>
            </form>

            <p class="text-center mt-3 mb-0">
              <a href="index.html" class="text-decoration-none">Ana sayfaya dön</a>
            </p>
          </div>
        </div>

        <p class="text-center text-muted mt-3 mb-0 small">© 2026 Film Dünyası</p>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
